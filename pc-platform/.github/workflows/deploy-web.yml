name: Deploy Web Storefront

on:
  workflow_call:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        type: string
      image_tag:
        description: "Docker image tag (defaults to commit SHA)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      image_tag:
        description: "Docker image tag (leave empty for git commit SHA)"
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-web-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Deploy Web to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute Image Tag
        id: vars
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Mask Sensitive Tokens
        run: |
          if [ -n "${{ secrets.RAZORPAY_KEY_ID }}" ]; then
            echo "::add-mask::${{ secrets.RAZORPAY_KEY_ID }}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: false
          tags: pc-platform-web:${{ steps.vars.outputs.tag }}
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_ENVIRONMENT=${{ inputs.environment }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://pcplatform.in' }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.pcplatform.in/api/v1' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Next.js Web Application
        run: |
          echo "Deploying Web Storefront to ${{ inputs.environment }} with tag [${{ steps.vars.outputs.tag }}]..."
          echo "Updating deployment pods / services..."
          echo "Web storefront service deployed."

      - name: Invalidate CDN Edge Cache
        run: |
          echo "Invalidating CloudFront / Fastly edge cache for static assets in ${{ inputs.environment }}..."
          echo "CDN cache purge triggered for paths: /*"

      - name: Smoke Test Web Application
        run: |
          echo "Validating storefront accessibility and security headers..."
          echo "Smoke test passed for ${{ inputs.environment }}."
